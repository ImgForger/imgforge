[package]
name = "imgforge"
version = "0.14.0"
edition = "2021"
repository = "https://github.com/ImgForger/imgforge"
description = "Fast and secure image proxy and transformation server"
authors = ["joker666 <mr.k779@outlook.com>"]
license = "GPL-3.0-only"
homepage = "https://imgforger.github.io"
readme = "README.md"
keywords = ["image", "proxy", "transform", "libvips", "rust"]
categories = [
    "multimedia",
    "multimedia::images",
    "web-programming",
    "web-programming::http-server",
]
exclude = ["doc/*", "AGENTS.md"]

[lib]
name = "imgforge"
path = "src/lib.rs"

[[bin]]
name = "imgforge"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.12.1"
libvips = "1.7.6"
kamadak-exif = "0.6.1"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", features = ["json"] }
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["full"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
num_cpus = "1.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10.2"
tower-http = { version = "0.7.0", features = ["trace", "timeout"] }
thiserror = "2.0.19"
foyer = "0.22.3"
axum-prometheus = "0.10.1"
lazy_static = "1.5.0"
governor = "0.10.4"
bytes = "1.12.1"
metrics = "0.24.6"

[dev-dependencies]
tempfile = "3.27.0"
image = "0.25.10"
lazy_static = "1.5.0"
percent-encoding = "2.3.2"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
base64 = "0.23.1"
hmac = "0.12.1"
futures = "0.3"
